<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSP 뉴스 검토</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding-bottom: 100px;
  }
  header {
    background: linear-gradient(160deg,#0a1628,#1428A0);
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.55);
    margin-bottom: 8px;
  }
  header h1 { font-size: 19px; font-weight: 900; margin-bottom: 6px; }
  header .sub { font-size: 12.5px; color: rgba(255,255,255,.7); }
  .wrap { max-width: 640px; margin: 16px auto; padding: 0 14px; }
  .company-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .company-head {
    background: #1428A0;
    color: #fff;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .company-head .cnt { font-size: 11px; font-weight: 500; opacity: .8; }
  .article-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
  }
  .article-row:last-child { border-bottom: none; }
  .article-row.removed { opacity: .35; }
  .article-row input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 2px; accent-color: #1428A0; flex-shrink: 0;
  }
  .article-row .a-title {
    font-size: 13.5px; font-weight: 600; color: #1e293b; text-decoration: none; display: block;
  }
  .article-row .a-date { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .empty { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13.5px; }
  .footer-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e2e8f0;
    padding: 12px 16px; display: flex; gap: 10px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .footer-bar button {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 14.5px; font-weight: 800; cursor: pointer;
  }
  .btn-save { background: #1428A0; color: #fff; }
  .btn-save:disabled { background: #94a3b8; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 10px;
    font-size: 13px; z-index: 999; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 13.5px; }
</style>
</head>
<body>

<header>
  <div class="label">SAMSUNG SDI PARTNERS ASSOCIATION</div>
  <h1 id="h-title">뉴스 검토</h1>
  <div class="sub" id="h-sub">불러오는 중...</div>
</header>

<div class="wrap" id="content">
  <div class="loading">뉴스 데이터를 불러오는 중입니다...</div>
</div>

<div class="footer-bar" id="footer" style="display:none">
  <button class="btn-save" id="btn-save">체크 해제한 기사 삭제 · 저장</button>
</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_URL = "https://shuttle-bus-cd8c2-default-rtdb.asia-southeast1.firebasedatabase.app";
const params = new URLSearchParams(location.search);
const ym = params.get('ym');
let originalData = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function load() {
  if (!ym) {
    document.getElementById('content').innerHTML = '<div class="empty">URL에 ?ym= 파라미터가 없습니다.</div>';
    return;
  }
  try {
    const res = await fetch(`${FIREBASE_URL}/ssp_news/${ym}.json`);
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    if (!data) {
      document.getElementById('content').innerHTML = '<div class="empty">해당 기간의 데이터를 찾을 수 없습니다.</div>';
      return;
    }
    originalData = data;
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>' + e.message + '</div>';
  }
}

function render(data) {
  const periodLabel = data.period || data.year_month || ym;
  document.getElementById('h-title').textContent = (data.test ? '[테스트] ' : '') + periodLabel + ' 뉴스 검토';
  document.getElementById('h-sub').textContent = `총 ${data.total || 0}건 · 체크 해제 후 저장하면 해당 기사는 삭제됩니다`;

  const news = data.news || {};
  const container = document.getElementById('content');
  container.innerHTML = '';

  let hasAny = false;
  Object.keys(news).forEach(company => {
    const items = news[company];
    if (!items || items.length === 0) return;
    hasAny = true;

    const card = document.createElement('div');
    card.className = 'company-card';
    card.dataset.company = company;

    const head = document.createElement('div');
    head.className = 'company-head';
    head.innerHTML = `<span>${company}</span><span class="cnt">${items.length}건</span>`;
    card.appendChild(head);

    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'article-row';
      row.dataset.idx = idx;
      row.innerHTML = `
        <input type="checkbox" checked>
        <div style="flex:1">
          <a class="a-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
          <div class="a-date">${item.date || ''}</div>
        </div>
      `;
      const cb = row.querySelector('input');
      cb.addEventListener('change', () => {
        row.classList.toggle('removed', !cb.checked);
        updateCount(card, company, items.length);
      });
      card.appendChild(row);
    });

    container.appendChild(card);
  });

  if (!hasAny) {
    container.innerHTML = '<div class="empty">표시할 뉴스가 없습니다.</div>';
  }

  document.getElementById('footer').style.display = 'flex';
}

function updateCount(card, company, originalLen) {
  const checked = card.querySelectorAll('input[type="checkbox"]:checked').length;
  card.querySelector('.cnt').textContent = `${checked}/${originalLen}건`;
}

async function save() {
  if (!originalData) return;
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const news = originalData.news || {};
  const updatedNews = {};
  let total = 0;

  document.querySelectorAll('.company-card').forEach(card => {
    const company = card.dataset.company;
    const items = news[company] || [];
    const kept = [];
    card.querySelectorAll('.article-row').forEach(row => {
      const idx = parseInt(row.dataset.idx, 10);
      const cb = row.querySelector('input');
      if (cb.checked) kept.push(items[idx]);
    });
    updatedNews[company] = kept;
    total += kept.length;
  });

  try {
    const res = await fetch(`${FIREBASE_URL}/ssp_news/${ym}.json`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ news: updatedNews, total })
    });
    if (!res.ok) throw new Error('저장 실패 (' + res.status + ')');
    showToast('저장되었습니다. 총 ' + total + '건');
    originalData.news = updatedNews;
    originalData.total = total;
  } catch (e) {
    showToast('저장 중 오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '체크 해제한 기사 삭제 · 저장';
  }
}

document.getElementById('btn-save').addEventListener('click', save);
load();
</script>

</body>
</html>
